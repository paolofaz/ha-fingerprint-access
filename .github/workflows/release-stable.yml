name: Verify and publish stable 1.0.0

on:
  push:
    branches:
      - main
    paths:
      - custom_components/fingerprint_access/manifest.json
      - RELEASE_NOTES_1.0.0.md

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_ha_test.txt
      - name: Install pinned Home Assistant runtime and official fixtures
        run: python -m pip install -r requirements_ha_test.txt
      - name: Run unit and simulated-manager regression tests
        run: python -m unittest discover -s tests -v
      - name: Run real Home Assistant runtime tests
        run: python -m pytest -q tests_ha
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Lovelace JavaScript syntax
        run: node --check custom_components/fingerprint_access/frontend/fingerprint-access-card.js

  verify-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  publish:
    needs: [verify-runtime, verify-hassfest]
    if: github.repository == 'paolofaz/ha-fingerprint-access' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release metadata and asset cache version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/fingerprint_access")
          assert json.loads((root / "manifest.json").read_text())["version"] == "1.0.0"
          assert 'CARD_RESOURCE_URL = CARD_RESOURCE_PATH + "?v=100"' in (
              root / "lovelace_resource.py"
          ).read_text()
          assert Path("RELEASE_NOTES_1.0.0.md").is_file()
          PY
      - name: Create GitHub tag and release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "GitHub Release v1.0.0 already exists; nothing to publish."
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Fingerprint Access 1.0.0" \
            --notes-file RELEASE_NOTES_1.0.0.md
