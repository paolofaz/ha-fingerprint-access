name: Policy checks
on:
  push:
  pull_request:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile sources
        run: python -m compileall -q custom_components tests
      - name: Test fail-closed policy
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dashboard JavaScript
        run: node --check custom_components/fingerprint_access/frontend/fingerprint-access-card.js
