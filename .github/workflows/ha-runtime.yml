name: Home Assistant runtime tests

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_ha_test.txt
      - name: Install Home Assistant and official pytest fixtures
        run: python -m pip install -r requirements_ha_test.txt
      - name: Run tests against real Home Assistant 2026.11
        run: python -m pytest -q tests_ha
